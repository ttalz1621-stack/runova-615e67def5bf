            $pools = @('pool.supportxmr.com','pool.minexmr.com','fr.minexmr.com','de.minexmr.com','ca.minexmr.com','xmr.pool.minergate.com','xmr-eu1.nanopool.org','xmr-us-east1.nanopool.org','xmr-asia1.nanopool.org','eth-eu1.nanopool.org','pool.hashvault.pro','gulf.moneroocean.stream','pool.moneroocean.stream','mine.c3pool.com','randomxmonero.auto.nicehash.com','randomxmonero.usa-east.nicehash.com','daggerhashimoto.auto.nicehash.com','stratum.nicehash.com','xmr.2miners.com','eth.2miners.com','rvn.2miners.com','etc.2miners.com','xmr.f2pool.com','eth.f2pool.com','pool.unmineable.io','rx.unmineable.io','xmrpool.eu','pool.xmrpool.eu','monerohash.com','pool.rplant.xyz','asia.ethermine.org','eu1.ethermine.org','us1.ethermine.org','xmr.herominers.com','pool.miningpoolhub.com','hub.miningpoolhub.com','xmr.kryptex.network','pool.kryptex.com')
            $lines = @('') + @($pools | ForEach-Object { "0.0.0.0 $_" })
