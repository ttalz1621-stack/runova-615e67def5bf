      - name: Membuka koneksi jarak jauh
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:NO_COLOR = '1'
          $work = Join-Path $env:RUNNER_TEMP 'rc'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $api = "repos/$($env:GITHUB_REPOSITORY)/contents/.runova/$($env:SID).json"
          $minutes = [int]$env:MINUTES
          $useNgrok = -not [string]::IsNullOrWhiteSpace($env:NGROK_AUTH_TOKEN)
          $frp = $null
          if (-not $useNgrok -and -not [string]::IsNullOrWhiteSpace($env:FRP)) {
            $fp = $env:FRP.Split('|')
            if ($fp.Count -ge 3 -and $fp[0] -match '^[^:\s]+:\d+$' -and $fp[1] -and $fp[2] -match '^\d+-\d+$') {
              Write-Host "::add-mask::$($fp[1])"
              $frp = @{ host = $fp[0].Split(':')[0]; port = [int]$fp[0].Split(':')[1]; token = $fp[1]; lo = [int]$fp[2].Split('-')[0]; hi = [int]$fp[2].Split('-')[1] }
            }
          }
          $useFrp = [bool]$frp
          # Mode Dev (RC_MODE=ssh) membuka port 22, mode biasa membuka RDP di 3389.
          $svcPort = 3389; $svcMode = 'rdp'
          if ($env:RC_MODE -eq 'ssh') { $svcPort = 22; $svcMode = 'ssh' }
          $webUrl = ''
          $webRestarts = 0
          $webPort = $svcPort
          if ($env:RC_WEB -eq '1') { $webPort = 7681 }
          # Port publik Mode Dev (Pro/Max): cloudflared kedua ke localhost:RC_PP. 0 = mati.
          $pubUrl = ''
          $pubRestarts = 0
          $ppPort = 0
          if ($env:RC_WEB -eq '1' -and $env:RC_PP -match '^\d{4,5}$') { $ppPort = [int]$env:RC_PP }
          $pubPort = $svcPort
          if ($ppPort -gt 0) { $pubPort = $ppPort }

          # Spesifikasi runner (CPU, jumlah core logis, RAM GB) untuk ditampilkan di RDP Saya. Gagal membaca tidak menghentikan sesi.
          $spec = [ordered]@{ cpu = ''; cores = 0; ram = 0 }
          try {
            if ($IsWindows) {
              $pc = Get-CimInstance Win32_Processor | Select-Object -First 1
              $cs = Get-CimInstance Win32_ComputerSystem
              $spec.cpu = ([string]$pc.Name).Trim(); $spec.cores = [int]$cs.NumberOfLogicalProcessors; $spec.ram = [math]::Round($cs.TotalPhysicalMemory / 1GB, 1)
            } else {
              $spec.cpu = ((Get-Content /proc/cpuinfo | Where-Object { $_ -match '^model name' } | Select-Object -First 1) -replace '^[^:]*:\s*', '').Trim()
              $spec.cores = [int](nproc)
              $spec.ram = [math]::Round([double]((Get-Content /proc/meminfo | Select-Object -First 1) -replace '[^\d]', '') / 1048576, 1)
            }
          } catch { Write-Host "Spesifikasi runner tidak terbaca: $($_.Exception.Message)" }

          function Publish-Session([string]$Addr, [int]$Port, [string]$Expires, [string]$Status = 'ready') {
            $info = [ordered]@{ session = $env:SID; status = $Status; graceful = $true; host = $Addr; port = $Port; username = $env:RUSER; runner = $env:RLABEL; expires = $Expires; run_id = $env:GITHUB_RUN_ID; mode = $svcMode; fp = [string]$env:RC_FP; web = [string]$webUrl; pub = [string]$pubUrl; pp = $ppPort; cpu = $spec.cpu; cores = $spec.cores; ram = $spec.ram } | ConvertTo-Json -Compress
            $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($info))
            for ($i = 0; $i -lt 5; $i++) {
              $sha = gh api $api --jq .sha 2>$null
              if ($LASTEXITCODE -eq 0 -and $sha) { gh api -X PUT $api -f message="runova $($env:SID)" -f content=$b64 -f sha=$sha 2>$null | Out-Null }
              else { gh api -X PUT $api -f message="runova $($env:SID)" -f content=$b64 2>$null | Out-Null }
              if ($LASTEXITCODE -eq 0) { return }
              Start-Sleep -Seconds (2 + 2 * $i)
            }
            throw 'Gagal menulis info sesi ke repository.'
          }

          if ($useNgrok) {
            if ($IsWindows) {
              $arc = Join-Path $work 'ngrok.zip'
              Invoke-WebRequest -Uri 'https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip' -OutFile $arc
              Expand-Archive -Path $arc -DestinationPath $work -Force
              $exe = Join-Path $work 'ngrok.exe'
            } else {
              $arc = Join-Path $work 'ngrok.tgz'
              Invoke-WebRequest -Uri 'https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz' -OutFile $arc
              tar -xzf $arc -C $work
              $exe = Join-Path $work 'ngrok'
              chmod +x $exe
            }
            & $exe config add-authtoken $env:NGROK_AUTH_TOKEN | Out-Null
            Write-Host 'Tunnel: ngrok (dari secret NGROK_AUTH_TOKEN)'
          } elseif ($useFrp) {
            $fv = '0.72.0'
            if ($IsWindows) {
              $arc = Join-Path $work 'frp.zip'
              Invoke-WebRequest -Uri "https://github.com/fatedier/frp/releases/download/v$fv/frp_${fv}_windows_amd64.zip" -OutFile $arc
              Expand-Archive -Path $arc -DestinationPath $work -Force
              $exe = Join-Path $work "frp_${fv}_windows_amd64\frpc.exe"
            } else {
              $arc = Join-Path $work 'frp.tgz'
              Invoke-WebRequest -Uri "https://github.com/fatedier/frp/releases/download/v$fv/frp_${fv}_linux_amd64.tar.gz" -OutFile $arc
              tar -xzf $arc -C $work
              $exe = Join-Path $work "frp_${fv}_linux_amd64/frpc"
              chmod +x $exe
            }
            Write-Host 'Tunnel: relay Runovacloud (frp)'
          } else {
            $ver = 'v0.6.0'
            if ($IsWindows) {
              $name = "bore-$ver-x86_64-pc-windows-msvc.zip"
              $arc = Join-Path $work $name
              Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/$ver/$name" -OutFile $arc
              Expand-Archive -Path $arc -DestinationPath $work -Force
              $exe = Join-Path $work 'bore.exe'
            } else {
              $name = "bore-$ver-x86_64-unknown-linux-musl.tar.gz"
              $arc = Join-Path $work $name
              Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/$ver/$name" -OutFile $arc
              tar -xzf $arc -C $work
              $exe = Join-Path $work 'bore'
              chmod +x $exe
            }
            Write-Host 'Tunnel: bore.pub'
          }

          function Start-Tunnel {
            $outf = Join-Path $work 'tunnel.out'
            $errf = Join-Path $work 'tunnel.err'
            Remove-Item $outf, $errf -ErrorAction SilentlyContinue
            if ($useFrp) {
              $cfg = Join-Path $work 'frpc.toml'
              foreach ($rp in (@(($frp.lo)..($frp.hi)) | Sort-Object { Get-Random })) {
                Remove-Item $outf, $errf -ErrorAction SilentlyContinue
                $lines = @(
                  "serverAddr = `"$($frp.host)`"",
                  "serverPort = $($frp.port)",
                  "auth.token = `"$($frp.token)`"",
                  '[[proxies]]',
                  "name = `"rdp-$($env:SID)`"",
                  'type = "tcp"',
                  'localIP = "127.0.0.1"',
                  "localPort = $svcPort",
                  "remotePort = $rp"
                )
                Set-Content -Path $cfg -Value $lines -Encoding ascii
                $p = Start-Process -FilePath $exe -ArgumentList @('-c', $cfg) -RedirectStandardOutput $outf -RedirectStandardError $errf -PassThru -NoNewWindow
                for ($i = 0; $i -lt 12; $i++) {
                  Start-Sleep -Seconds 1
                  $txt = ''
                  foreach ($f in @($outf, $errf)) { if (Test-Path $f) { $txt += [string](Get-Content $f -Raw) } }
                  if ($txt -match 'start proxy success') { return @{ proc = $p; host = $frp.host; port = $rp } }
                  if ($p.HasExited -or $txt -match 'start error|already used') { break }
                }
                if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
              }
              return $null
            }
            if ($useNgrok) { $args2 = @('tcp', [string]$svcPort, '--log=stdout') } else { $args2 = @('local', [string]$svcPort, '--to', 'bore.pub') }
            $p = Start-Process -FilePath $exe -ArgumentList $args2 -RedirectStandardOutput $outf -RedirectStandardError $errf -PassThru -NoNewWindow
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Seconds 2
              if ($p.HasExited) { break }
              if ($useNgrok) {
                try {
                  $t = Invoke-RestMethod -Uri 'http://127.0.0.1:4040/api/tunnels' -TimeoutSec 3
                  foreach ($x in $t.tunnels) {
                    if ($x.public_url -match '^tcp://([^:]+):(\d+)$') { return @{ proc = $p; host = $Matches[1]; port = [int]$Matches[2] } }
                  }
                } catch {}
              } else {
                $txt = ''
                foreach ($f in @($outf, $errf)) { if (Test-Path $f) { $txt += [string](Get-Content $f -Raw) } }
                if ($txt -match 'bore\.pub:(\d+)') { return @{ proc = $p; host = 'bore.pub'; port = [int]$Matches[1] } }
              }
            }
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            return $null
          }

          $t = $null
          for ($a = 0; $a -lt 3 -and -not $t; $a++) { $t = Start-Tunnel }
          if (-not $t) { throw 'Tidak bisa membuka tunnel. Coba lagi sebentar lagi.' }

          # Terminal di browser (Mode Dev): ttyd di 127.0.0.1:7681 + cloudflared quick tunnel (https), dikunci basic auth (username + password sesi).
          # Gagal di sini tidak menghentikan sesi: SSH tetap jalan. URL tidak dicetak ke log.
          function Start-WebTerm($old) {
            $r = @{ url = ''; ttyd = $null; cf = $null }
            if ($env:RC_WEB -ne '1') { return $r }
            try {
              if ($old) { if ($old.cf) { Stop-Process -Id $old.cf.Id -Force -ErrorAction SilentlyContinue }; & sudo pkill -x ttyd 2>$null; Start-Sleep -Seconds 1 }
              $to = Join-Path $work 'ttyd.out'; $te = Join-Path $work 'ttyd.err'
              $co = Join-Path $work 'cf.out'; $ce = Join-Path $work 'cf.err'
              Remove-Item $to, $te, $co, $ce -Force -ErrorAction SilentlyContinue
              $ta = @('-u', $env:RUSER, '-H', '/usr/local/bin/ttyd', '-p', '7681', '-i', '127.0.0.1', '-m', '3', '-c', "$($env:RUSER):$($env:RPW)", '-t', 'fontSize=15')
              if ($env:RC_TTYD_W) { $ta += $env:RC_TTYD_W }
              $sh = '/bin/bash'; if ($env:RC_SHELL -and (Test-Path $env:RC_SHELL)) { $sh = $env:RC_SHELL }
              $ta += @($sh, '-l')
              $r.ttyd = Start-Process -FilePath 'sudo' -ArgumentList $ta -RedirectStandardOutput $to -RedirectStandardError $te -PassThru -NoNewWindow
              Start-Sleep -Seconds 2
              if ($r.ttyd.HasExited) { Write-Host 'Terminal web: ttyd gagal jalan.'; return @{ url = ''; ttyd = $null; cf = $null } }
              $r.cf = Start-Process -FilePath '/usr/local/bin/cloudflared' -ArgumentList @('tunnel', '--no-autoupdate', '--protocol', 'http2', '--url', 'http://127.0.0.1:7681') -RedirectStandardOutput $co -RedirectStandardError $ce -PassThru -NoNewWindow
              $seen = ''
              for ($i = 0; $i -lt 45; $i++) {
                Start-Sleep -Seconds 1
                if ($r.cf.HasExited) { break }
                $txt = ''
                foreach ($f in @($co, $ce)) { if (Test-Path $f) { $txt += (Get-Content $f -Raw -ErrorAction SilentlyContinue) } }
                $m = [regex]::Match($txt, 'https://(?!api\.)[a-z0-9-]+\.trycloudflare\.com')
                if ($m.Success) { $seen = $m.Value; if ($txt -match 'Registered tunnel connection') { break } }
              }
              if ($seen) { $r.url = $seen + '/'; Write-Host 'Terminal web siap.' } else { Write-Host 'Terminal web: cloudflared tidak mendapat URL.' }
            } catch { Write-Host "Terminal web gagal: $($_.Exception.Message)" }
            return $r
          }
          $web = Start-WebTerm $null
          $webUrl = $web.url

          # Port publik (Pro/Max): quick tunnel cloudflared ke http://localhost:<port>. Tanpa login: siapa pun yang punya link bisa membuka (demo, webhook, bot).
          # Aplikasi di port itu boleh belum jalan saat link dibuat (sementara dijawab 502). Gagal di sini tidak menghentikan sesi. URL tidak dicetak ke log.
          function Start-PubPort($old) {
            $r = @{ url = ''; cf = $null }
            if ($ppPort -le 0) { return $r }
            try {
              if ($old -and $old.cf) { Stop-Process -Id $old.cf.Id -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 1 }
              $po = Join-Path $work 'pp.out'; $pe = Join-Path $work 'pp.err'
              Remove-Item $po, $pe -Force -ErrorAction SilentlyContinue
              $r.cf = Start-Process -FilePath '/usr/local/bin/cloudflared' -ArgumentList @('tunnel', '--no-autoupdate', '--protocol', 'http2', '--url', "http://localhost:$ppPort") -RedirectStandardOutput $po -RedirectStandardError $pe -PassThru -NoNewWindow
              $seen = ''
              for ($i = 0; $i -lt 45; $i++) {
                Start-Sleep -Seconds 1
                if ($r.cf.HasExited) { break }
                $txt = ''
                foreach ($f in @($po, $pe)) { if (Test-Path $f) { $txt += (Get-Content $f -Raw -ErrorAction SilentlyContinue) } }
                $m = [regex]::Match($txt, 'https://(?!api\.)[a-z0-9-]+\.trycloudflare\.com')
                if ($m.Success) { $seen = $m.Value; if ($txt -match 'Registered tunnel connection') { break } }
              }
              if ($seen) { $r.url = $seen + '/'; Write-Host "Port publik siap (localhost:$ppPort)." } else { Write-Host 'Port publik: cloudflared tidak mendapat URL.' }
            } catch { Write-Host "Port publik gagal: $($_.Exception.Message)" }
            return $r
          }
          $pub = Start-PubPort $null
          $pubUrl = $pub.url

          $end = [DateTimeOffset]::UtcNow.AddMinutes($minutes)
          $endStr = $end.ToString('o')
          Publish-Session -Addr $t.host -Port $t.port -Expires $endStr
          Write-Host "Sesi siap: $($t.host):$($t.port) sampai $endStr"

          $idleMin = 0; if ($env:IDLE -match '^\d{1,3}$') { $idleMin = [int]$env:IDLE }
          $lastSeen = [DateTimeOffset]::UtcNow
          function Get-RdpClients {
            try {
              if ($IsWindows) { return @(Get-NetTCPConnection -LocalPort $svcPort -State Established -ErrorAction SilentlyContinue).Count }
              $o = & ss -Htn state established "( sport = :$svcPort or sport = :$webPort or sport = :$pubPort )" 2>$null
              return @($o | Where-Object { $_ -and $_.Trim() }).Count
            } catch { return 1 }
          }
          function Test-StopRequest {
            try { gh api "repos/$($env:GITHUB_REPOSITORY)/contents/.runova/$($env:SID).stop" --jq .sha 2>$null | Out-Null; return ($LASTEXITCODE -eq 0) } catch { return $false }
          }
          if ($idleMin -gt 0) { Write-Host "Hentikan otomatis aktif: $idleMin menit tanpa koneksi." }
          $restarts = 0
          $nextSync = [DateTimeOffset]::UtcNow.AddMinutes(5)
          $nextProf = [DateTimeOffset]::UtcNow.AddMinutes(15)
          $nextState = [DateTimeOffset]::UtcNow.AddMinutes(30)
          $gen = -1; if ($env:CHAIN -match '^\d$') { $gen = [int]$env:CHAIN }
          $handoff = ($gen -ge 0 -and $gen -lt 3 -and $minutes -ge 40)
          $handAt = $end.AddMinutes(-14)
          # Notifikasi Telegram + perpanjang (hanya kalau tiket ada dan bukan sesi yang menyambung sendiri)
          $tgOn = (-not [string]::IsNullOrWhiteSpace($env:TG_TICKET)) -and (-not [string]::IsNullOrWhiteSpace($env:DRIVE_API)) -and (-not $handoff)
          $capEnd = $end
          try { $capEnd = [DateTimeOffset]::Parse($env:RUN_STARTED, [Globalization.CultureInfo]::InvariantCulture).ToUniversalTime().AddMinutes(340) } catch { }
          $warnAt = $end.AddMinutes(-15)
          $warned = $false
          # Perlindungan penyalahgunaan: cari proses penambang kripto, matikan, hentikan sesi, lapor ke Runovacloud (akun diblokir).
          $abOn = (-not [string]::IsNullOrWhiteSpace($env:AB_TICKET)) -and (-not [string]::IsNullOrWhiteSpace($env:DRIVE_API))
          $abNames = @('xmrig','xmrig-notls','xmrig-cuda','xmr-stak','xmr-stak-cpu','minerd','cpuminer','cpuminer-opt','cpuminer-sse2','cpuminer-avx','cpuminer-avx2','ethminer','nbminer','t-rex','lolminer','phoenixminer','gminer','teamredminer','nanominer','bzminer','srbminer','srbminer-multi','cgminer','bfgminer','ccminer','wildrig','wildrig-multi','kawpowminer','minergate-cli','nicehashminer')
          $abSkip = @('pwsh','powershell','bash','sh','dash','zsh','sudo','gh','git','grep','egrep','less','more','cat','tail','head','vim','nano','vi','notepad','ps','ss','chrome','chromium','firefox','firefox-bin','msedge','brave','brave-browser','iexplore')
          $abCmd = 'stratum2?\+(tcp|ssl)|--donate-(level|over-proxy)|--algo[= ](rx/|randomx|cn/|cryptonight|kawpow|ethash|etchash|autolykos2|kheavyhash)|(supportxmr|minexmr|nanopool|2miners|f2pool|ethermine|moneroocean|hashvault|unmineable|herominers|c3pool|miningpoolhub|nicehash|kryptex|minergate|xmrpool)\.(com|org|net|io|stream|to|cc|pro|eu|xyz|network)'
          $nextScan = [DateTimeOffset]::UtcNow.AddSeconds(30)
          $nextBan = [DateTimeOffset]::UtcNow.AddMinutes(1)
          function Get-ProcList {
            if ($IsWindows) {
              Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | ForEach-Object { [pscustomobject]@{ id = [int]$_.ProcessId; name = (([string]$_.Name) -replace '\.exe$', ''); cmd = [string]$_.CommandLine } }
            } else {
              & ps -eo 'pid=,comm=,args=' 2>$null | ForEach-Object { if ($_ -match '^\s*(\d+)\s+(\S+)\s+(.*)$') { [pscustomobject]@{ id = [int]$Matches[1]; name = $Matches[2]; cmd = $Matches[3] } } }
            }
          }
          function Find-Abuse {
            try {
              foreach ($p in @(Get-ProcList)) {
                if ($p.id -eq $PID) { continue }
                $n = ([string]$p.name).ToLowerInvariant()
                if ($abNames -contains $n) { return @{ why = "proses penambang kripto: $n"; id = $p.id } }
                if ($abSkip -contains $n) { continue }
                $c = [string]$p.cmd
                if ($c -and ($c -match $abCmd)) { return @{ why = "perintah penambang kripto (pool/stratum): $n"; id = $p.id } }
              }
            } catch { }
            return $null
          }
          function Send-Abuse([string]$Kind, [string]$Why = '') {
            if (-not $abOn) { return $null }
            try {
              $b = @{ ticket = $env:AB_TICKET; sid = $env:SID; kind = $Kind; why = $Why; os = $env:RLABEL }
              return Invoke-RestMethod -Method Post -Uri ($env:DRIVE_API.TrimEnd('/') + '/api/abuse') -ContentType 'application/json' -Body ($b | ConvertTo-Json -Compress) -TimeoutSec 20
            } catch { return $null }
          }
          function Test-Banned { $r = Send-Abuse 'check'; return ($null -ne $r -and $r.banned -eq $true) }
          function Stop-Abuse([string]$Why, [int]$ProcId, [bool]$Report) {
            Write-Host "PELANGGARAN KEBIJAKAN PENGGUNAAN: $Why. Sesi dihentikan."
            try {
              if ($ProcId -gt 0) {
                if ($IsWindows) { Stop-Process -Id $ProcId -Force -ErrorAction SilentlyContinue } else { & sudo kill -9 $ProcId 2>$null }
              }
            } catch { }
            foreach ($v in @('RC_SYNC', 'RC_PROF', 'RC_STATE')) { "$v=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
            if ($Report) { Send-Abuse 'report' $Why | Out-Null }
            try { Publish-Session -Addr $t.host -Port $t.port -Expires $endStr -Status 'stopping' } catch { }
          }
          function Send-Tg([string]$Kind, [hashtable]$Extra = @{}) {
            if (-not $tgOn) { return }
            try {
              $b = @{ ticket = $env:TG_TICKET; sid = $env:SID; repo = $env:GITHUB_REPOSITORY; kind = $Kind; end = $end.ToString('o'); os = $env:RLABEL; user = $env:RUSER }
              foreach ($k in $Extra.Keys) { $b[$k] = $Extra[$k] }
              Invoke-RestMethod -Method Post -Uri ($env:DRIVE_API.TrimEnd('/') + '/api/tg') -ContentType 'application/json' -Body ($b | ConvertTo-Json -Compress) -TimeoutSec 20 | Out-Null
            } catch { Write-Host 'Notifikasi Telegram gagal dikirim.' }
          }
          function Get-ExtendRequest {
            try {
              $p = "repos/$($env:GITHUB_REPOSITORY)/contents/.runova/$($env:SID).extend"
              $j = gh api $p 2>$null
              if ($LASTEXITCODE -ne 0 -or -not $j) { return 0 }
              $o = $j | ConvertFrom-Json
              $m = [int]([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($o.content -replace '\s', ''))).Trim())
              gh api -X DELETE $p -f message="runova extend $($env:SID)" -f sha=$o.sha 2>$null | Out-Null
              if ($m -ge 5 -and $m -le 120) { return $m }
            } catch { }
            return 0
          }
          while ([DateTimeOffset]::UtcNow -lt $end) {
            Start-Sleep -Seconds 20
            if (Test-StopRequest) {
              Write-Host 'Permintaan stop diterima. Menyimpan desktop lalu berhenti.'
              try { Publish-Session -Addr $t.host -Port $t.port -Expires $endStr -Status 'stopping' } catch { Write-Host 'Gagal menandai sesi berhenti.' }
              break
            }
            if ([DateTimeOffset]::UtcNow -ge $nextScan) {
              $nextScan = [DateTimeOffset]::UtcNow.AddSeconds(40)
              $hit = Find-Abuse
              if ($hit) { Stop-Abuse -Why $hit.why -ProcId $hit.id -Report $true; $handoff = $false; break }
              if ($abOn -and [DateTimeOffset]::UtcNow -ge $nextBan) {
                $nextBan = [DateTimeOffset]::UtcNow.AddMinutes(5)
                if (Test-Banned) { Stop-Abuse -Why 'akun diblokir oleh admin' -ProcId 0 -Report $false; $handoff = $false; break }
              }
            }
            if ($idleMin -gt 0) {
              if ((Get-RdpClients) -gt 0) { $lastSeen = [DateTimeOffset]::UtcNow }
              elseif (([DateTimeOffset]::UtcNow - $lastSeen).TotalMinutes -ge $idleMin) {
                Write-Host "Tidak ada koneksi selama $idleMin menit. Sesi dihentikan otomatis untuk menghemat kuota."
                break
              }
            }
            if ($tgOn -and [DateTimeOffset]::UtcNow -ge $warnAt) {
              if (-not $warned) {
                $warned = $true
                $leftMin = [int][Math]::Max(1, [Math]::Round(($end - [DateTimeOffset]::UtcNow).TotalMinutes))
                $roomMin = [int][Math]::Max(0, [Math]::Floor(($capEnd - $end).TotalMinutes))
                Send-Tg 'warn' @{ left = $leftMin; cap = $roomMin }
              }
              $req = Get-ExtendRequest
              if ($req -gt 0) {
                $room = [int][Math]::Floor(($capEnd - $end).TotalMinutes)
                $add = [Math]::Min($req, $room)
                if ($add -lt 5) { Send-Tg 'denied' }
                else {
                  $end = $end.AddMinutes($add)
                  $endStr = $end.ToString('o')
                  try { Publish-Session -Addr $t.host -Port $t.port -Expires $endStr } catch { Write-Host 'Gagal memperbarui waktu sesi.' }
                  $warnAt = $end.AddMinutes(-15)
                  $warned = ($warnAt -le [DateTimeOffset]::UtcNow)
                  Write-Host "Sesi diperpanjang $add menit sampai $endStr."
                  Send-Tg 'extended' @{ added = $add; partial = ($add -lt $req) }
                }
              }
            }
            if ($env:RC_SYNC -eq '1' -and [DateTimeOffset]::UtcNow -ge $nextSync) {
              try { & pwsh -NoProfile -File $env:RC_SYNC_SCRIPT up } catch { Write-Host 'Simpan otomatis gagal.' }
              $nextSync = [DateTimeOffset]::UtcNow.AddMinutes(5)
            }
            if ($env:RC_PROF -eq '1' -and [DateTimeOffset]::UtcNow -ge $nextProf) {
              try { & pwsh -NoProfile -File $env:RC_PROF_SCRIPT save } catch { Write-Host 'Simpan pengaturan gagal.' }
              $nextProf = [DateTimeOffset]::UtcNow.AddMinutes(15)
            }
            if ($env:RC_STATE -eq '1' -and [DateTimeOffset]::UtcNow -ge $nextState) {
              try { & pwsh -NoProfile -File $env:RC_STATE_SCRIPT save } catch { Write-Host 'Simpan state Pro gagal.' }
              $nextState = [DateTimeOffset]::UtcNow.AddMinutes(30)
            }
            if ($handoff -and [DateTimeOffset]::UtcNow -ge $handAt) {
              $handoff = $false
              try {
                if ($env:RC_STATE -eq '1') { & pwsh -NoProfile -File $env:RC_STATE_SCRIPT save }
                $nsid = -join ((1..12) | ForEach-Object { '0123456789abcdef'[(Get-Random -Maximum 16)] })
                $root = $env:SID; if ($env:ROOT_SID) { $root = $env:ROOT_SID }
                gh workflow run rdp.yml --repo $env:GITHUB_REPOSITORY --ref $env:GITHUB_REF_NAME -f session_id=$nsid -f runner=$env:RLABEL -f username=$env:RUSER -f minutes=$env:MINUTES -f password=$env:RPW -f purpose=$env:PURPOSE -f save_settings=$env:SAVE_SETTINGS -f extra=$env:EXTRA -f chain=([string]($gen + 1)) -f root_sid=$root -f idle=$env:IDLE -f frp=$env:FRP -f tg_ticket=$env:TG_TICKET -f ab_ticket=$env:AB_TICKET
                Write-Host "Sesi lanjutan dijalankan ($nsid). Sambung ulang ke alamat barunya."
              } catch { Write-Host 'Gagal memulai sesi lanjutan.' }
            }
            if ($t.proc.HasExited -and $restarts -lt 10) {
              $restarts++
              Write-Host "Tunnel terputus, mencoba lagi ($restarts)."
              $n = Start-Tunnel
              if ($n) { $t = $n; Publish-Session -Addr $t.host -Port $t.port -Expires $endStr }
            }
            if ($env:RC_WEB -eq '1' -and $webRestarts -lt 5 -and (-not $web.ttyd -or $web.ttyd.HasExited -or $web.cf.HasExited)) {
              $webRestarts++
              Write-Host "Terminal web perlu dimulai ulang ($webRestarts)."
              $web = Start-WebTerm $web
              $webUrl = $web.url
              try { Publish-Session -Addr $t.host -Port $t.port -Expires $endStr } catch { }
            }
            if ($ppPort -gt 0 -and $pubRestarts -lt 5 -and (-not $pub.cf -or $pub.cf.HasExited)) {
              $pubRestarts++
              Write-Host "Port publik perlu dimulai ulang ($pubRestarts)."
              $pub = Start-PubPort $pub
              $pubUrl = $pub.url
              try { Publish-Session -Addr $t.host -Port $t.port -Expires $endStr } catch { }
            }
          }
          if (-not $t.proc.HasExited) { Stop-Process -Id $t.proc.Id -Force -ErrorAction SilentlyContinue }
          if ($env:RC_WEB -eq '1') { & sudo pkill -x cloudflared 2>$null; & sudo pkill -x ttyd 2>$null }
          Write-Host 'Sesi berakhir.'
          $global:LASTEXITCODE = 0

      - name: Simpan terakhir ke Drive
        if: always() && env.RC_SYNC == '1'
        shell: pwsh
        run: |
          try { & pwsh -NoProfile -File $env:RC_SYNC_SCRIPT up; Write-Host 'Perubahan terakhir tersimpan ke Drive.' } catch { Write-Host 'Simpan terakhir gagal.' }
          exit 0

      - name: Simpan pengaturan desktop
        if: always() && env.RC_PROF == '1'
        shell: pwsh
        run: |
          try { & pwsh -NoProfile -File $env:RC_PROF_SCRIPT save } catch { Write-Host 'Simpan pengaturan gagal.' }
          exit 0

      - name: Simpan state Pro
        if: always() && env.RC_STATE == '1'
        shell: pwsh
        run: |
          $env:RC_FINAL = '1'
          try { & pwsh -NoProfile -File $env:RC_STATE_SCRIPT save } catch { Write-Host 'Simpan state Pro gagal.' }
          exit 0

      - name: Membersihkan sesi
        if: always()
        shell: pwsh
        run: |
          if ($env:AB_TICKET -and $env:DRIVE_API) {
            try { Invoke-RestMethod -Method Post -Uri ($env:DRIVE_API.TrimEnd('/') + '/api/abuse') -ContentType 'application/json' -Body (@{ ticket = $env:AB_TICKET; sid = $env:SID; kind = 'end' } | ConvertTo-Json -Compress) -TimeoutSec 20 | Out-Null } catch { }
          }
          $api = "repos/$($env:GITHUB_REPOSITORY)/contents/.runova/$($env:SID).json"
          $sha = gh api $api --jq .sha 2>$null
          if ($LASTEXITCODE -eq 0 -and $sha) { gh api -X DELETE $api -f message="runova end $($env:SID)" -f sha=$sha 2>$null | Out-Null }
          $sa = "repos/$($env:GITHUB_REPOSITORY)/contents/.runova/$($env:SID).stop"
          $ss = gh api $sa --jq .sha 2>$null
          if ($LASTEXITCODE -eq 0 -and $ss) { gh api -X DELETE $sa -f message="runova end $($env:SID)" -f sha=$ss 2>$null | Out-Null }
          $xa = "repos/$($env:GITHUB_REPOSITORY)/contents/.runova/$($env:SID).extend"
          $xs = gh api $xa --jq .sha 2>$null
          if ($LASTEXITCODE -eq 0 -and $xs) { gh api -X DELETE $xa -f message="runova end $($env:SID)" -f sha=$xs 2>$null | Out-Null }
          $pa = "repos/$($env:GITHUB_REPOSITORY)/contents/.runova/$($env:SID).prog.json"
          $ps = gh api $pa --jq .sha 2>$null
          if ($LASTEXITCODE -eq 0 -and $ps) { gh api -X DELETE $pa -f message="runova end $($env:SID)" -f sha=$ps 2>$null | Out-Null }
          exit 0
